<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampManager · Services</title><style>body{font:16px system-ui;background:#f4f7f5;color:#18372c;margin:0}main{max-width:620px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}label{display:block;margin:12px 0 5px}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbc9c1;border-radius:9px}button{background:#176947;color:white;border:0;margin-top:15px;cursor:pointer}small{color:#54685d}#notice{font-weight:bold}</style><main><h1>🌿 CampManager</h1><p>Services et assistance pendant votre séjour</p><section><h2>Votre demande</h2><form id="form"><label for="unit">Hébergement ou emplacement</label><input id="unit" required maxlength="25" placeholder="Ex. MH125"><label for="kind">Type de demande</label><select id="kind"><option>Problème technique</option><option>Ménage</option><option>Équipement supplémentaire</option><option>Départ tardif</option><option>Réservation d'activité</option><option>Autre demande</option></select><label for="detail">Précisions</label><textarea id="detail" rows="4" required maxlength="1000"></textarea><button>Préparer la demande</button></form><p id="notice" role="status"></p></section><section><h2>Informations importantes</h2><p>Cette version est une démonstration. Aucune demande n'est transmise à un camping.</p><small>En cas d'urgence ou de connexion indisponible, contactez directement la réception.</small></section></main><script>const params=new URLSearchParams(location.search),unit=document.querySelector('#unit');if(params.has('unit'))unit.value=params.get('unit').slice(0,25);document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#notice').textContent='Démonstration uniquement : demande préparée, non envoyée.';});</script></html>
