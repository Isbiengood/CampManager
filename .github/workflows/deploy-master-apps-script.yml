name: Mettre a jour le MASTER Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "apps-script/31_Menage.gs"
      - "apps-script/75_MiseEnForme.gs"
      - "apps-script/90_OnEdit.gs"
      - "apps-script/91_Menage_Secours_Drive.gs"
      - "apps-script/94_Controle_Gouvernante_Manuel_V4.gs"
      - "apps-script/96_Supabase_V4_Synchronisation.gs"
      - ".github/workflows/deploy-master-apps-script.yml"

  workflow_dispatch:
    inputs:
      mode:
        description: "Action a effectuer"
        required: true
        default: "verification"
        type: choice
        options:
          - verification
          - deploiement


permissions:
  contents: read

jobs:
  master:
    runs-on: ubuntu-latest

    env:
      MASTER_SCRIPT_ID: "1tLlIsjUxATHQkWVXwrzCaBcyUvxqeI1Uh5vb7oqVD9fK_GSJ_vatgQB1"

    steps:
      - name: Recuperer CampManager
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Charger les identifiants Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Le secret GitHub CLASPRC_JSON n'est pas configure."
            exit 1
          fi

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Cloner le MASTER actuel
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/campmanager-master"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          clasp clone "$MASTER_SCRIPT_ID"

          test -f appsscript.json || {
            echo "::error::Le manifeste appsscript.json du MASTER n'a pas ete recupere."
            exit 1
          }

      - name: Corriger la configuration du MASTER
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/campmanager-master"
          CONFIG_FILE="$(find "$DEPLOY_DIR" -maxdepth 1 -type f -name '04_Configuration_CampManager*' | head -n 1)"

          if [ -z "$CONFIG_FILE" ]; then
            echo "::error::Le fichier de configuration CampManager est introuvable."
            exit 1
          fi

          sed -i 's#https://hhgybhjozivgguiklpkw.supabase.co#https://yjclaskssxtoqzpvtrnz.supabase.co#g' "$CONFIG_FILE"
          sed -i 's#v4-zero-to-one-test.html#v4-opensource-test.html#g' "$CONFIG_FILE"

          echo "Configuration MASTER corrigée."

      - name: Afficher la configuration publique du MASTER
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/campmanager-master"
          echo "=== Configuration publique du MASTER ==="
          for cfg in "$DEPLOY_DIR"/04_Configuration_CampManager*; do
            [ -e "$cfg" ] || continue
            echo "--- $(basename "$cfg") ---"
            grep -n -A1 -E 'SUPABASE_URL|BRIDGE_FUNCTION_SLUG|PUBLIC_APP_URL' "$cfg" || true
          done

      - name: Remplacer les modules geres par GitHub
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/campmanager-master"

          # GitHub est la source de verite pour les modules CampManager.
          # On supprime donc les anciens fichiers de code du MASTER afin
          # d'eviter de conserver un module renomme ou obsolete.
          #
          # Seule la configuration propre au MASTER reste locale.
          find "$DEPLOY_DIR" -maxdepth 1 -type f \
            \( -name '*.js' -o -name '*.gs' \) \
            ! -name '04_Configuration_CampManager*.js' \
            ! -name '04_Configuration_CampManager*.gs' \
            -delete

          for src in "$GITHUB_WORKSPACE"/apps-script/*.gs; do
            fichier="$(basename "$src")"

            # La configuration reelle du MASTER reste locale.
            # Le fichier .example du depot ne doit jamais l'ecraser.
            if [ "$fichier" = "04_Configuration_CampManager.example.gs" ]; then
              continue
            fi

            nom="${fichier%.gs}"
            cp "$src" "$DEPLOY_DIR/$nom.gs"
          done

          echo "Modules CampManager prepares :"
          find "$DEPLOY_DIR" -maxdepth 1 -type f \
            \( -name '*.gs' -o -name '*.js' -o -name '*.html' -o -name 'appsscript.json' \) \
            -printf '%f\n' | sort

      - name: Verifier la syntaxe JavaScript
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/campmanager-master"
          CHECK_DIR="$RUNNER_TEMP/campmanager-syntax-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          erreur=0

          for src in "$DEPLOY_DIR"/*.gs "$DEPLOY_DIR"/*.js; do
            [ -e "$src" ] || continue

            nom="$(basename "$src")"
            cible="$CHECK_DIR/${nom%.*}.js"
            cp "$src" "$cible"

            echo "Verification syntaxe : $nom"

            if ! node --check "$cible"; then
              erreur=1
            fi
          done

          if [ "$erreur" -ne 0 ]; then
            echo "::error::Au moins un module Apps Script contient une erreur de syntaxe."
            exit 1
          fi

      - name: Verifier les fichiers qui seraient pousses
        working-directory: ${{ runner.temp }}/campmanager-master
        run: clasp status

      - name: Mettre a jour le MASTER
        if: ${{ github.event_name == 'push' || inputs.mode == 'deploiement' }}
        working-directory: ${{ runner.temp }}/campmanager-master
        run: |
          clasp push --force
          echo "MASTER Apps Script mis a jour depuis le commit $GITHUB_SHA"
