
<style>
  :root {
    --bleu-fonce: #17365d;

    --fond: #f3f5f8;

    --violet: #7b1fa2;
    --orange: #ef6c00;
    --ombre: 0 10px 28px rgba(23, 54, 93, 0.14);
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fond);
    color: var(--texte);
    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    font-size: 18px;
    line-height: 1.4;
  }

  button,
  select {
    font: inherit;
    touch-action: manipulation;
  }

  .entete {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;

      calc(18px + env(safe-area-inset-top))

      18px;
    color: var(--blanc);
    background: var(--bleu-fonce);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.20);
  }

  .sur-titre {
    margin: 0 0 5px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.08em;
    opacity: 0.85;
  }

  .libelle-equipe {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.02em;
    opacity: 1;
    color: var(--bleu-fonce);
  }

  h1,
  h2,
  p {
    margin-top: 0;

  }

  .texte-secondaire {

    font-weight: 700;
  }

  .bouton-principal,
  .bouton-action {

  .bouton-principal:active,
  .bouton-action:active,
  .bouton-icone:active {
    transform: translateY(1px);
  }

  button:disabled {
    cursor: wait;
    opacity: 0.55;
  }

  .bouton-icone {
    width: 58px;
    height: 58px;
    flex: 0 0 auto;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 50%;
    color: var(--blanc);
    background: rgba(255, 255, 255, 0.14);
    font-size: 32px;
    cursor: pointer;
  }

  .barre-equipe {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }

  .barre-equipe h2 {
    margin-bottom: 0;
    font-size: clamp(28px, 7vw, 38px);
  }

  .bouton-secondaire {

    padding: 0 16px;
    border: 1px solid var(--bordure);
    border-radius: 14px;
    background: var(--blanc);
    font-weight: 800;
    cursor: pointer;
  }

  .statut {
    margin-bottom: 22px;
    padding: 17px 18px;
    border-radius: 16px;
    font-size: 19px;
    font-weight: 900;
    line-height: 1.4;
    text-align: center;
  }

  .role-utilisateur {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    margin: 4px 0 8px;
    padding: 8px 13px;
    border-radius: 12px;
    color: var(--bleu-fonce);
    background: #ffffff;
    border: 1px solid var(--bordure);
    font-size: 18px;
    font-weight: 900;
  }

  .role-utilisateur.gouvernante {
    color: #6a1b9a;
    background: #f3e5f5;
  }

  .role-utilisateur.menage {
    color: #17365d;
    background: #eaf1fb;
  }

  .zone-controles-a-venir {
    margin-top: 16px;
    padding: 16px;
    border: 2px dashed #c8b6e2;
    border-radius: 18px;
    background: #faf7ff;
  }

  .zone-controles-a-venir.cache {
    display: none;
  }

  .entete-a-venir {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .titre-a-venir {

    font-weight: 900;
    color: #6a1b9a;
  }

  .compteur-a-venir {
    margin-top: 4px;
    font-size: 18px;
    font-weight: 800;
    color: #6a1b9a;
  }

  .liste-a-venir {
    display: grid;
    gap: 10px;
  }

  .carte-a-venir {
    display: grid;
    grid-template-columns: minmax(70px, 90px) 1fr;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid #dfd3ef;
    background: #ffffff;
  }

  .numero-a-venir {
    font-size: 28px;
    font-weight: 900;
    color: #17365d;
    text-align: center;
  }

  .texte-a-venir {
    font-size: 17px;
    line-height: 1.35;
    color: #4a4a4a;
  }

  .texte-a-venir strong {
    color: #6a1b9a;
  }

  .compteur-logements {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    margin-top: 4px;
    padding: 10px 16px;
    border-radius: 14px;
    color: var(--bleu-fonce);
    background: #eaf1fb;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.3;
  }

  .compteur-logements.termine {
    color: #1b5e20;
    background: #e8f5e9;
  }

  .statut-ok {
    color: #1b5e20;
    background: #e8f5e9;
  }

  .statut-attente {
    color: #7a4d00;
    background: #fff4d6;
  }

  .statut-erreur {
    color: #8b1a1a;
    background: #fde8e8;
  }

  .liste-logements {
    display: grid;
    gap: 18px;
  }

  .carte-logement {
    overflow: hidden;
    border-radius: 22px;
  }

  .bandeau-logement {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 86px;
    padding: 16px 18px;
    color: var(--blanc);
    background: var(--bleu);
  }

  .priorite-rouge .bandeau-logement {
    background: var(--rouge);
  }

  .priorite-violette .bandeau-logement {
    background: var(--violet);
  }

  .priorite-bleue .bandeau-logement {
    background: var(--bleu);
  }

  .numero-logement {
    font-size: clamp(42px, 11vw, 58px);
    line-height: 1;
    font-weight: 950;
    letter-spacing: 0.02em;
  }

  .symboles {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 30px;
  }

  .contenu-carte {
    padding: 20px 18px 22px;
  }

  .etat-actuel {
    margin-bottom: 14px;
    color: var(--texte-secondaire);
    font-size: 20px;
    line-height: 1.4;
  }

  .etat-actuel strong {
    color: var(--texte);
    font-size: 22px;
  }

  .bouton-action {
    min-height: 74px;
    margin-top: 8px;
    font-size: 22px;
  }

  .bouton-action[data-action="À vérifier"] {
    background: var(--orange);
  }

  .bouton-action[data-action="Prêt"] {
    background: var(--vert);
  }

  .panneau-centre {
    padding: 42px 22px;
    text-align: center;
  }

  .panneau-centre h2 {
    font-size: 30px;
  }

  .panneau-centre p {
    font-size: 19px;
    line-height: 1.5;
  }

  .icone-vide {
    margin-bottom: 14px;
    font-size: 58px;
  }

  .message {
    position: fixed;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 14px;
    z-index: 30;
    max-width: 650px;
    margin: 0 auto;
    padding: 17px 18px;
    border-radius: 16px;
    color: var(--blanc);
    background: #263238;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    font-size: 17px;
    line-height: 1.4;
    font-weight: 800;
  }

  .zone-reset {
    margin-top: 32px;
    padding-top: 18px;
    text-align: center;
    border-top: 1px solid var(--bordure);
  }

  .bouton-reset {
    min-height: 48px;
    padding: 0 16px;
    border: 1px solid var(--bordure);
    border-radius: 14px;
    color: var(--texte-secondaire);
    background: transparent;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }

  .cache {
    display: none !important;
  }

  /* Téléphones compacts */
  @media (max-width: 390px) {
    body {
      font-size: 17px;
    }

    main {
      padding-right: 10px;
      padding-left: 10px;
    }

    .panneau {
      padding: 24px 16px;
    }

    .texte-secondaire {
      font-size: 19px;
    }

    .select-equipe {
      min-height: 64px;
      font-size: 20px;
    }

    .numero-logement {
      font-size: 44px;
    }

    .symboles {
      font-size: 27px;
    }

    .etat-actuel {
      font-size: 19px;
    }

    .etat-actuel strong {
      font-size: 21px;
    }

    .bouton-action {
      min-height: 70px;
      font-size: 20px;
    }
  }

  /* Grands téléphones / tablettes : une seule colonne pour garder des cartes XXL */
  @media (min-width: 640px) {
    .liste-logements {
      grid-template-columns: 1fr;
    }

    .carte-logement {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
  }

  /* ==========================================================
     CAMPMANAGER MOBILE V3.2.1
     RÉGLAGES + MODE SOMBRE
     ========================================================== */

  .actions-entete {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }

  body.mode-sombre {
    --fond: #121212;
    --blanc: #1f1f1f;
    --texte: #ffffff;
    --texte-secondaire: #c7c7c7;
    --bordure: #3b3b3b;
    --ombre: 0 10px 28px rgba(0, 0, 0, 0.42);
    background: var(--fond);
    color: var(--texte);
  }

  body.mode-sombre .panneau,
  body.mode-sombre .panneau-centre,
  body.mode-sombre .carte-logement,
  body.mode-sombre .role-utilisateur,
  body.mode-sombre .carte-a-venir,
  body.mode-sombre .bouton-secondaire,
  body.mode-sombre .select-equipe {
    background: #1f1f1f;
    color: #ffffff;
    border-color: #3b3b3b;
  }

  body.mode-sombre .libelle-equipe,
  body.mode-sombre .numero-a-venir,
  body.mode-sombre .texte-a-venir,
  body.mode-sombre .texte-a-venir strong {
    color: #ffffff;
  }

  body.mode-sombre .zone-controles-a-venir {
    background: #211b26;
    border-color: #6d4c7d;
  }

  body.mode-sombre .titre-a-venir,
  body.mode-sombre .compteur-a-venir {
    color: #d7a5f4;
  }

  body.mode-sombre .statut-attente {
    background: #242424;
    color: #ffffff;
  }

  body.mode-sombre .statut-synchronise {
    background: #15351c;
    color: #d9ffe1;
  }

  body.mode-sombre .statut-hors-ligne {
    background: #4a2c00;
    color: #fff0d4;
  }

  @media (max-width: 420px) {
    .actions-entete {
      gap: 7px;
    }

    .actions-entete .bouton-icone {
      width: 52px;
      height: 52px;
      font-size: 27px;
    }
  }


  /* CAMPMANAGER V3.2.2 — RÉGLAGES */
  .voile-reglages {
    position: fixed;
    z-index: 5000;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(10,18,28,.62);
    backdrop-filter: blur(4px);
  }
  .voile-reglages.cache { display: none; }

  .fenetre-reglages {
    width: min(620px, 100%);
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    border-radius: 22px;
    background: var(--blanc);
    color: var(--texte);
    box-shadow: 0 18px 55px rgba(0,0,0,.28);
    padding: 22px;
  }

  .entete-reglages {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }

  .entete-reglages h2 {
    margin: 0;
    font-size: 30px;
  }

  .bouton-fermer-reglages {
    width: 50px;
    height: 50px;
    border: 0;
    border-radius: 14px;
    background: #eef2f6;
    color: #17365d;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
  }

  .bloc-reglage {
    margin-top: 12px;
    padding: 16px;
    border: 1px solid var(--bordure);
    border-radius: 16px;
    background: var(--blanc);
  }

  .ligne-reglage {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .titre-reglage {
    display: block;
    font-size: 19px;
    font-weight: 900;
  }

  .texte-reglage {
    display: block;
    margin-top: 5px;
    font-size: 15px;
    line-height: 1.4;
    color: var(--texte-secondaire);
  }

  .largeur-complete {
    width: 100%;
    margin-top: 12px;
  }

  .interrupteur-reglage {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    width: 58px;
    height: 33px;
    flex: 0 0 auto;
    border: 0;
    border-radius: 999px;
    background: #9aa4af;
    cursor: pointer;
    transition: .18s;
  }

  .interrupteur-reglage::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.28);
    transition: .18s;
  }

  .interrupteur-reglage:checked { background: #2e7d32; }
  .interrupteur-reglage:checked::after { transform: translateX(25px); }
  .interrupteur-reglage:disabled { opacity: .45; cursor: not-allowed; }

  .bouton-danger-reglages {
    width: 100%;
    min-height: 54px;
    margin-top: 16px;
    border: 1px solid #e0aaa6;
    border-radius: 15px;
    background: #fff0ef;
    color: #a8241d;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }

  .etat-connexion-reglages {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 850;
  }

  body.mode-sombre .fenetre-reglages,
  body.mode-sombre .bloc-reglage {
    background: #1f1f1f;
    color: #fff;
    border-color: #3b3b3b;
  }

  body.mode-sombre .texte-reglage { color: #c7c7c7; }
  body.mode-sombre .bouton-fermer-reglages {
    background: #303030;
    color: #fff;
  }
  body.mode-sombre .bouton-danger-reglages {
    background: #351a18;
    border-color: #70403c;
    color: #ffb4ad;
  }

  @media (max-width: 600px) {
    .voile-reglages {
      align-items: flex-end;
      padding: 0;
    }
    .fenetre-reglages {
      width: 100%;
      max-height: 92vh;
      border-radius: 24px 24px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    }
  }


  /* V3.2.3 — priorité absolue : client déjà arrivé */
  .carte-logement.priorite-attente {
    border: 3px solid #f59f00;
    background: #fff3bf;
    box-shadow: 0 0 0 3px rgba(245,159,0,.18);
  }

  .carte-logement.priorite-attente .symboles {
    font-size: 24px;
    font-weight: 900;
  }

  body.mode-sombre .carte-logement.priorite-attente {
    background: #5f4700;
    border-color: #ffd43b;
    color: #ffffff;
  }


  /* ==========================================================
     V3.2.4 — CORRECTIF MODE SOMBRE / BOUTONS DE VALIDATION
     var(--blanc) devient sombre en mode sombre ; le texte des
     boutons d'action doit rester blanc.
     ========================================================== */
  body.mode-sombre .bouton-action,
  body.mode-sombre .bouton-principal {
    color: #ffffff !important;
  }

  body.mode-sombre .bouton-action[data-action="À vérifier"] {
    background: var(--orange);
    color: #ffffff !important;
  }

  body.mode-sombre .bouton-action[data-action="Prêt"] {
    background: var(--vert);
    color: #ffffff !important;
  }

  body.mode-sombre .bouton-action:not(:disabled),
  body.mode-sombre .bouton-principal:not(:disabled) {
    opacity: 1;
    pointer-events: auto;
  }

</style>
